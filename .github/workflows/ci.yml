name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

      - name: Build app
        run: go tool mygo build -skip-dmg

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict build/darwin-arm64/YTGrab.app
          build/darwin-arm64/YTGrab.app/Contents/Resources/bin/yt-dlp --version
          build/darwin-arm64/YTGrab.app/Contents/Resources/bin/ffmpeg -version | head -1
